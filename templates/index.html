<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rota Generator</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    textarea { width: 100%; height: 260px; font-family: monospace; }
    .row { display: flex; gap: 12px; }
    .col { flex: 1; min-width: 0; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { border: 1px solid #ccc; padding: 4px; vertical-align: top; }
    .badge { display: inline-block; border: 1px solid #888; border-radius: 4px; padding: 2px 6px; margin: 2px; cursor: move; }
    .dropzone { min-height: 28px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Rota Generator (Mon-Sat, 30-min slots)</h1>
  <p>Single worksheet export, single container app.</p>

  <div class="row">
    <div class="col">
      <h3>Configuration JSON</h3>
      <textarea id="config">{{ sample_json }}</textarea>
      <button id="generateBtn">Generate</button>
      <a href="/export.xlsx" target="_blank">Export XLSX</a>
      <p id="message" class="error"></p>
    </div>
  </div>

  <h3>Schedule Grid</h3>
  <div id="grid"></div>

  <h3>Conflicts</h3>
  <pre id="conflicts"></pre>

  <script src="/static/app.js"></script>
</body>
</html>
