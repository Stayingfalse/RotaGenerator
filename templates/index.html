<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rota Generator</title>
  <style>
    body { margin: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f8fb; color: #1f2937; }
    #app { padding: 20px; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .section-title { margin-top: 0; margin-bottom: 12px; font-size: 1.1rem; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 200px; }
    .btn { border: 1px solid #d1d5db; border-radius: 8px; background: #fff; padding: 8px 12px; cursor: pointer; }
    .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn.danger { color: #b91c1c; border-color: #fca5a5; background: #fff5f5; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    input, select { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 8px; padding: 6px 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { border: 1px solid #e5e7eb; padding: 6px; vertical-align: top; }
    th { background: #f3f4f6; position: sticky; top: 0; z-index: 1; }
    .table-wrap { overflow: auto; max-height: 520px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #d1d5db; border-radius: 999px; padding: 2px 8px; margin: 3px; background: #f9fafb; font-size: 12px; }
    .muted { color: #6b7280; font-size: 12px; }
    .error { color: #b00020; margin-top: 8px; }
    .badge { display: inline-block; border: 1px solid #9ca3af; border-radius: 999px; padding: 3px 8px; margin: 3px; cursor: move; background: #fff; }
    .dropzone { min-height: 30px; }
    .day-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .day-tabs .btn.active { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #fcfcfd; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(17, 24, 39, .45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #fff; width: min(560px, calc(100vw - 24px)); border-radius: 10px; border: 1px solid #e5e7eb; padding: 16px; box-shadow: 0 18px 40px rgba(0,0,0,.2); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.__INITIAL_CONFIG__ = {{ sample_payload|tojson }};
  </script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
